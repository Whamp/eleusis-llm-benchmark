# Eleusis LLM Benchmark - Smoke Test Configuration
# Verifies auth and model wiring end-to-end with one short round on an easy rule.
# Use this with the same --model you plan to benchmark in the full run.

game:
  num_rules: 1
  num_rounds_per_rule: 1
  max_turns: 8
  hand_size: 12
  wrong_guess_penalty: 2
  seed: 42

rule_compiler:
  # Matches the production config.yaml compiler (Novita gpt-oss-120b medium)
  # with smoke-tuned retries and simulation counts.
  provider: openai_compat
  model_id: openai/gpt-oss-120b
  base_url: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
  temperature: 0.7
  reasoning_effort: medium
  extra_body:
    provider:
      order: [Novita]
      allow_fallbacks: false
  max_retries: 3
  num_simulations: 20
  turns_per_simulation: 20
  simulation_seed: 42

rules:
  library_path: "rules.json"
  selection: "sequential"
  index: 0  # even_ranks_only

llm:
  max_tokens: 16384
  max_llm_retries: 3
  temperature: 0.7
  seed: 42
