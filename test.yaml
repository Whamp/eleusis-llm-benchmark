# Eleusis LLM Benchmark - Solo Mode Configuration
# Single-player pattern discovery mode

# Provider configuration
providers:
  huggingface:
    api_key_env: "HF_TOKEN"
  openrouter:
    api_key_env: "OPENROUTER_API_KEY"
    referer: "eleusis-benchmark"


# Game settings
game:
  num_rounds: 0  # Set to 0 to use entire rule library
  max_turns: 40
  hand_size: 12
  wrong_guess_penalty: 2

# Seed for reproducibility (same rule -> same initial hand/deck for different models)
# Comment out or remove to use random shuffling
seed: 42


# Rule compiler model configuration (converts natural language rules to code)
rule_compiler:
  model_name: "hf:openai/gpt-oss-120b"
  temperature: 0.8


# Rule source configuration
rules:
  library_path: "test_rules.json"
  selection: "sequential"
  index: 0
  rounds_per_rule: 1


# LLM configuration
llm:
  max_tokens: 8192
  max_llm_retries: 3
  max_continuation_attempts: 3
  temperature: 0.7
  seed: 42  # Seed for LLM generation (not guaranteed deterministic, but helps reproducibility)

# Model names support provider prefixes:
#   "hf:model-name" → HuggingFace Inference Providers
#   "openrouter:model-name" → OpenRouter API
model: "hf:openai/gpt-oss-120b"
#model: "openrouter:openai/gpt-5-nano"