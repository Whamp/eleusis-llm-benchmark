# Model configurations for Eleusis LLM Benchmark
# Each model key can be referenced in config.yaml

# ============================================================================
# Closed Providers - Direct API Access
# ============================================================================

claude-opus:
  provider: anthropic
  model_id: claude-opus-4-5-20251101
  reasoning_budget: 8192  # budget_tokens for extended thinking
  # For force-answer: thinking={"type": "disabled"}

gpt-5.2:
  provider: openai
  model_id: gpt-5.2
  reasoning_effort: medium  # none|minimal|low|medium|high|xhigh

gemini-3-pro:
  provider: google
  model_id: gemini-3-pro
  thinking_level: high  # low|high (cannot disable on Pro)

grok-4:
  provider: xai
  model_id: grok-4-fast-reasoning
  # Alternative: grok-4-fast-non-reasoning for no reasoning
  # Grok-4 always reasons at max capacity, no effort parameter


# ============================================================================
# Open Models - HuggingFace Inference Providers
# ============================================================================

deepseek-r1:
  provider: huggingface
  model_id: deepseek-ai/DeepSeek-R1
  hf_provider: together
  reasoning_format: think_tags  # Uses <think>...</think> in content

kimi-k2:
  provider: huggingface
  model_id: moonshotai/Kimi-K2-Instruct
  hf_provider: novita
  reasoning_format: separate_field

glm-4.7:
  provider: huggingface
  model_id: THUDM/GLM-4.7-0414-Thinking
  hf_provider: novita
  reasoning_format: separate_field

gpt-oss-120b:
  provider: huggingface
  model_id: openai/gpt-oss-120b
  hf_provider: together
  reasoning_format: separate_field
