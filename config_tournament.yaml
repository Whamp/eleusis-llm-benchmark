# Eleusis LLM Benchmark - Tournament Mode Configuration
# Multi-player mode where multiple LLM scientists compete

# Provider configuration
providers:
  huggingface:
    api_key_env: "HF_TOKEN"
  openrouter:
    api_key_env: "OPENROUTER_API_KEY"
    referer: "eleusis-benchmark"

# Model configuration
models:
  max_tokens: 4096
  max_llm_retries: 3
  max_continuation_attempts: 3

  # Model names support provider prefixes:
  #   "hf:model-name" → HuggingFace Inference Providers
  #   "openrouter:model-name" → OpenRouter API
  #   "model-name" (no prefix) → defaults to HuggingFace

  # Game master model (rule compilation, etc.)
  game_master:
    name: "hf:openai/gpt-oss-120b"
    temperature: 0.8
    display_name: "GPT OSS 120B"

  # Competing players (list determines number of players)
  players:
    - name: "hf:openai/gpt-oss-120b"
      temperature: 0.7
      display_name: "GPT OSS 120B"

    - name: "hf:deepseek-ai/DeepSeek-R1:fastest"
      temperature: 0.7
      display_name: "DeepSeek-R1"

    - name: "hf:Qwen/Qwen3-235B-A22B-Thinking-2507:fastest"
      temperature: 0.7
      display_name: "Qwen3-235B-A22B-Thinking-2507"

#    - name: "hf:meta-llama/Llama-3.3-70B-Instruct"
#      temperature: 0.7
#      display_name: "Llama-3.3-70B-Instruct"

#    - name: "openrouter:anthropic/claude-3-5-sonnet"
#      temperature: 0.7
#      display_name: "Claude 3.5 Sonnet"


# Rule source configuration
rule_source:
  library_path: "rules.json"
  min_acceptance: 0.15
  max_acceptance: 0.55
  selection: "sequential"
  index: 1
  tournament_rounds: 5
  rounds_per_rule: 1

# Tournament game settings
game:
  max_turns: 40
  pause_after_turn: false

  # Game parameters
  cards_per_scientist: 12
  correct_guess_bonus: -6
  wrong_guess_penalty: 2
  card_reject_penalty: 2
  no_play_incorrect_penalty: 3
  no_play_correct_reduction: 3
