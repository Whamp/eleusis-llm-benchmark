# Eleusis LLM Benchmark Configuration

# Model configuration
models:
  # Model for rule-maker
  rule_maker:
    name: "openai/gpt-oss-120b"
    temperature: 0.8
    display_name: "GPT OSS 120B"

  # Models for scientists (list determines number of players)
  players:
    - name: "openai/gpt-oss-20b"
      temperature: 0.7
      display_name: "GPT OSS 20B Scientist 1"

    - name: "openai/gpt-oss-20b"
      temperature: 0.7
      display_name: "GPT OSS 20B Scientist 2"

    - name: "openai/gpt-oss-20b"
      temperature: 0.7
      display_name: "GPT OSS 20B Scientist 3"

  # Model for referee (rule equivalence checking)
  referee:
    name: "openai/gpt-oss-120b"
    temperature: 0.3
    display_name: "GPT OSS 120B"

# Game settings
game:
  max_turns: 20
  pause_after_turn: true  # Wait for user input after each turn

  # Game parameters
  cards_per_scientist: 12  # Initial hand size for each scientist
  correct_guess_bonus: -3  # Points deducted for guessing rule correctly
  wrong_guess_penalty: 1  # Penalty card for incorrect guess
  card_reject_penalty: 2  # Cards drawn when a card is rejected
  no_play_incorrect_penalty: 4  # Penalty cards for incorrect no-play
  no_play_correct_reduction: 4  # Cards reduced from hand on correct no-play (min 1)
  max_llm_retries: 3  # Max retries for LLM when parsing fails
  max_rule_generation_attempts: 3  # Max attempts to generate a valid rule
  max_tokens: 8192  # Max tokens for LLM generation
  max_tokens_referee: 8192  # Max tokens for referee rule checking
