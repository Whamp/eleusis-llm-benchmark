# Eleusis LLM Benchmark - Solo Mode Configuration
# Single-player pattern discovery mode

# Game settings
game:
  num_rules: 0  # Number of distinct rules to test (0 = use entire rule library)
  num_rounds_per_rule: 1  # How many rounds to play with each rule
  max_turns: 40
  hand_size: 12
  wrong_guess_penalty: 2
  seed: 42  # Seed for reproducibility (same rule -> same initial hand/deck)


# Rule compiler model configuration (converts natural language rules to code)
rule_compiler:
  model: gpt-oss-120b  # References key in models.yaml
  temperature: 0.8


# Rule source configuration
rules:
  library_path: "rules.json"
  selection: "sequential"
  index: 0


# LLM configuration
llm:
  max_tokens: 16384
  max_llm_retries: 3
  temperature: 0.7
  seed: 42  # Seed for LLM generation (not guaranteed deterministic, but helps reproducibility)
