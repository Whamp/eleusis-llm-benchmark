# Eleusis LLM Benchmark - Solo Mode Configuration
# Single-player pattern discovery mode

# Provider configuration
providers:
  huggingface:
    api_key_env: "HF_TOKEN"
  openrouter:
    api_key_env: "OPENROUTER_API_KEY"
    referer: "eleusis-benchmark"

# Model configuration
models:
  max_tokens: 4096
  max_llm_retries: 3
  max_continuation_attempts: 3

  # Model names support provider prefixes:
  #   "hf:model-name" → HuggingFace Inference Providers
  #   "openrouter:model-name" → OpenRouter API
  #   "model-name" (no prefix) → defaults to HuggingFace

  # Game master model (rule compilation)
  game_master:
    name: "hf:openai/gpt-oss-120b"
    temperature: 0.8
    display_name: "GPT OSS 120B"

# Rule source configuration
rule_source:
  library_path: "rules.json"
  min_acceptance: 0.15
  max_acceptance: 0.55
  selection: "sequential"
  index: 1
  rounds_per_rule: 1

# Solo game settings
solo_game:
  num_rounds: 50
  max_turns: 40
  pause_after_turn: false

  # Game parameters
  hand_size: 12
  wrong_guess_penalty: 2

