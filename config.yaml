# Eleusis LLM Benchmark Configuration

# Model configuration
models:

  max_tokens: 4096  # Maximum tokens for all models
  max_llm_retries: 3  # Max retries for LLM when parsing fails

  # Model for game_master (rule maker, referee...)
  game_master:
    name: "openai/gpt-oss-120b"
    temperature: 0.8
    display_name: "GPT OSS 120B"


  # Models for scientists (list determines number of players)
  players:
    - name: "meta-llama/Llama-3.3-70B-Instruct"
      temperature: 0.7
      display_name: "Llama-3.3-70B-Instruct"

    - name: "openai/gpt-oss-120b"
      temperature: 0.7
      display_name: "GPT OSS 120B"

    - name: "openai/gpt-oss-20b"
      temperature: 0.7
      display_name: "GPT OSS 20B"


# Rule source configuration
rule_source:
  library_path: "rules.json"  # Path to rule library JSON file
  min_acceptance: 0.15      # Minimum avg acceptance rate for rules in library
  max_acceptance: 0.55
  selection: "random"  # "random" or "sequential"
  index: 54  # Starting index for sequential selection
  tournament_rounds: 5  # Number of rounds in tournament mode
  rounds_per_rule: 1  # How many rounds to play same rule before changing

# Game settings
game:
  max_turns: 40
  pause_after_turn: false  # Wait for user input after each turn

  # Game parameters
  cards_per_scientist: 12  # Initial hand size for each scientist
  correct_guess_bonus: -6  # Points deducted for guessing rule correctly
  wrong_guess_penalty: 2  # Penalty card for incorrect guess
  card_reject_penalty: 2  # Cards drawn when a card is rejected
  no_play_incorrect_penalty: 3  # Penalty cards for incorrect no-play
  no_play_correct_reduction: 3  # Cards reduced from hand on correct no-play (min 1)

