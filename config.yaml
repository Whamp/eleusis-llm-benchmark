# Eleusis LLM Benchmark - Solo Mode Configuration
# Single-player pattern discovery mode

# Game settings
game:
  num_rules: 0  # Number of distinct rules to test (0 = use entire rule library)
  num_rounds_per_rule: 3  # How many rounds to play with each rule
  max_turns: 30
  hand_size: 12
  wrong_guess_penalty: 2
  seed: 42  # Seed for reproducibility (same rule -> same initial hand/deck)
  shadow_mode: offline  # Shadow evaluation mode: offline (default), online, disabled


# Rule compiler model configuration (converts natural language rules to code)
# Primary and fallback chain chosen by the compiler tournament of 2026-08-16;
# see results/compiler-tournament/20260816/summary.md. Each entry is pinned to
# one OpenRouter server so routing stays deterministic and reproducible.
rule_compiler:
  # Model config (inline, not referencing models.yaml)
  provider: openai_compat
  model_id: openai/gpt-oss-120b
  base_url: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
  temperature: 0.7
  reasoning_effort: medium
  extra_body:
    provider:
      order: [Novita]
      allow_fallbacks: false
  max_retries: 10             # Retries on compilation failure
  num_simulations: 100        # Number of simulation runs for rule comparison
  turns_per_simulation: 40    # Turns per simulation run
  simulation_seed: 42         # Seed for reproducible simulation RNG
  # Used only after the primary exhausts its retries; tried in order.
  backup_providers:
    - provider: openai_compat
      model_id: openai/gpt-oss-120b
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      temperature: 0.7
      reasoning_effort: medium
      extra_body:
        provider:
          order: [AkashML]
          allow_fallbacks: false
    - provider: openai_compat
      model_id: openai/gpt-oss-120b
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      temperature: 0.7
      reasoning_effort: medium
      extra_body:
        provider:
          order: [Nebius]
          allow_fallbacks: false
    - provider: openai_compat
      model_id: openai/gpt-oss-120b
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      temperature: 0.7
      reasoning_effort: medium
      extra_body:
        provider:
          order: [Groq]
          allow_fallbacks: false
    - provider: openai_compat
      model_id: openai/gpt-oss-120b
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      temperature: 0.7
      reasoning_effort: medium
      extra_body:
        provider:
          order: [Cerebras]
          allow_fallbacks: false
    # Different model as the final link: diversity against a gpt-oss-wide
    # outage. Cloudflare was the only server that honors temperature for
    # deepseek-v4-flash-0731; run at its recommended temperature and low effort.
    - provider: openai_compat
      model_id: deepseek/deepseek-v4-flash-0731
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      temperature: 1.0
      reasoning_effort: low
      extra_body:
        provider:
          order: [Cloudflare]
          allow_fallbacks: false


# Rule source configuration
rules:
  library_path: "rules.json"
  selection: "sequential"
  index: 0


# LLM configuration
llm:
  max_tokens: 16384
  max_llm_retries: 3
  temperature: 0.7
  seed: 42  # Seed for LLM generation. Support varies: Google/xAI/HuggingFace pass to API (best-effort); Anthropic/OpenAI APIs don't support seed.
